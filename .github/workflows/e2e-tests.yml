name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cucumber-dev:
    name: Cucumber BDD — dev
    runs-on: ubuntu-latest

    services:
      api:
        image: ghcr.io/danielsilva-loanpro/sdet-interview-challenge:latest
        ports:
          - 3000:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/dev/users > /dev/null 2>&1; then
              echo "API is ready"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done

      - name: Run dev Cucumber tests
        env:
          BASE_URL: http://localhost:3000
          AUTH_TOKEN: mysecrettoken
        run: npm run test:dev

      - name: Upload dev Cucumber reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-reports-dev
          path: |
            reports/cucumber-report.html
            reports/cucumber-report.json

  cucumber-prod:
    name: Cucumber BDD — prod
    runs-on: ubuntu-latest

    services:
      api:
        image: ghcr.io/danielsilva-loanpro/sdet-interview-challenge:latest
        ports:
          - 3000:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/prod/users > /dev/null 2>&1; then
              echo "API is ready"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done

      - name: Run prod Cucumber tests
        env:
          BASE_URL: http://localhost:3000
          AUTH_TOKEN: mysecrettoken
        run: npm run test:prod

      - name: Upload prod Cucumber reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-reports-prod
          path: |
            reports/cucumber-report.html
            reports/cucumber-report.json
