name: E2E Tests

on:
  push:
    branches: [main, demo]
  pull_request:
  workflow_dispatch:

jobs:
  cucumber-dev:
    name: Cucumber BDD - dev
    runs-on: ubuntu-latest

    services:
      api:
        image: ghcr.io/danielsilva-loanpro/sdet-interview-challenge:latest
        ports:
          - 3000:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/dev/users > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "API failed"
          exit 1

      - name: Run tests (dev)
        env:
          BASE_URL: http://localhost:3000
          AUTH_TOKEN: mysecrettoken
        run: npm run test:dev

      - name: Upload report (dev)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-dev
          path: reports/

  cucumber-prod:
    name: Cucumber BDD - prod
    runs-on: ubuntu-latest

    services:
      api:
        image: ghcr.io/danielsilva-loanpro/sdet-interview-challenge:latest
        ports:
          - 3000:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/prod/users > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "API failed"
          exit 1

      - name: Run tests (prod)
        env:
          BASE_URL: http://localhost:3000
          AUTH_TOKEN: mysecrettoken
        run: npm run test:prod

      - name: Upload report (prod)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-prod
          path: reports/
